# fly.toml app configuration file generated for abhay-expense-tracker-2026 on 2026-11-02T13:53:12+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'abhay-expense-tracker-2026'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  FLASK_DEBUG = '0'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
