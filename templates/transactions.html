{% extends "base.html" %}

{% block title %}Transactions - Expense Tracker{% endblock %}
{% block nav_transactions %}active{% endblock %}

{% block content %}
<!-- Page Header -->
<div class="page-header">
  <div class="header-title-group">
    <h1>Transactions</h1>
    <p id="txSummarySubtitle">Loading transaction history...</p>
  </div>
  <button type="button" class="btn-primary" onclick="openAddModal()">
    <svg><use href="#icon-plus"></use></svg>
    <span>Add</span>
  </button>
</div>

<!-- Search and Category Filters -->
<div class="filter-bar">
  <div class="search-box">
    <svg><use href="#icon-search"></use></svg>
    <input type="text" class="search-input" id="txSearchInput" placeholder="Search notes or categories">
  </div>
  <select class="select-filter" id="txCategorySelect">
    <option value="All">All Categories</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Shopping">Shopping</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Health">Health</option>
    <option value="Education">Education</option>
    <option value="Travel">Travel</option>
    <option value="Other">Other</option>
  </select>
</div>

<!-- Transactions Grouped List -->
<div id="transactionsListContainer">
  <!-- Dynamic grouped cards loaded by JS -->
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/transactions.js') }}"></script>
{% endblock %}
