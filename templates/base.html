<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Personal Expense Tracker{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <!-- Global SVG Sprite for Icons -->
  <svg style="display: none;">
    <symbol id="icon-rupee" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3a4 4 0 0 0 0-8"/>
    </symbol>
    <symbol id="icon-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
      <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
      <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
    </symbol>
    <symbol id="icon-transactions" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="8" y1="6" x2="21" y2="6"></line>
      <line x1="8" y1="12" x2="21" y2="12"></line>
      <line x1="8" y1="18" x2="21" y2="18"></line>
      <line x1="3" y1="6" x2="3.01" y2="6"></line>
      <line x1="3" y1="12" x2="3.01" y2="12"></line>
      <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </symbol>
    <symbol id="icon-budget" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"></path>
      <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </symbol>
    <symbol id="icon-utensils" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 2v6a3 3 0 0 1-3 3 3 3 0 0 1-3-3V2"></path>
      <path d="M15 2v19"></path>
      <path d="M5 2v7a3 3 0 0 0 3 3 3 3 0 0 0 3-3V2"></path>
      <path d="M8 12v9"></path>
    </symbol>
    <symbol id="icon-car" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2"></path>
      <circle cx="7" cy="17" r="2"></circle>
      <circle cx="17" cy="17" r="2"></circle>
    </symbol>
    <symbol id="icon-shopping-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
      <line x1="3" y1="6" x2="21" y2="6"></line>
      <path d="M16 10a4 4 0 0 1-8 0"></path>
    </symbol>
    <symbol id="icon-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"></path>
      <path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"></path>
      <path d="M12 6v12"></path>
    </symbol>
    <symbol id="icon-film" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
      <line x1="7" y1="2" x2="7" y2="22"></line>
      <line x1="17" y1="2" x2="17" y2="22"></line>
      <line x1="2" y1="12" x2="22" y2="12"></line>
      <line x1="2" y1="7" x2="7" y2="7"></line>
      <line x1="2" y1="17" x2="7" y2="17"></line>
      <line x1="17" y1="17" x2="22" y2="17"></line>
      <line x1="17" y1="7" x2="22" y2="7"></line>
    </symbol>
    <symbol id="icon-heart-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
    </symbol>
    <symbol id="icon-graduation-cap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
      <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
    </symbol>
    <symbol id="icon-plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"></path>
    </symbol>
    <symbol id="icon-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"></path>
      <path d="M7 7h.01"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </symbol>
  </svg>

  <div class="app-container">
    <!-- Fixed Left Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-top">
        <a href="/" class="sidebar-logo" title="Expense Tracker">
          <svg style="width: 22px; height: 22px;"><use href="#icon-rupee"></use></svg>
        </a>
        <nav class="sidebar-nav">
          <a href="/" class="nav-item {% block nav_dashboard %}{% endblock %}" title="Dashboard">
            <svg><use href="#icon-dashboard"></use></svg>
          </a>
          <a href="/transactions" class="nav-item {% block nav_transactions %}{% endblock %}" title="Transactions">
            <svg><use href="#icon-transactions"></use></svg>
          </a>
          <a href="/budget" class="nav-item {% block nav_budget %}{% endblock %}" title="Budget">
            <svg><use href="#icon-budget"></use></svg>
          </a>
        </nav>
      </div>

      <div class="sidebar-bottom">
        <button type="button" class="btn-sidebar-add" id="btnSidebarAdd" title="Add Transaction">
          <svg><use href="#icon-plus"></use></svg>
        </button>
        {% if current_user %}
        <div class="sidebar-user-section" style="margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div class="user-avatar" title="Logged in as {{ current_user.username }}" style="width: 34px; height: 34px; border-radius: 50%; background-color: #10b981; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; text-transform: uppercase; box-shadow: 0 1px 3px rgba(16, 185, 129, 0.3);">
            {{ current_user.username[0] }}
          </div>
          <a href="/logout" title="Log out ({{ current_user.username }})" class="btn-icon-action" style="width: 32px; height: 32px; color: var(--text-muted);">
            <svg style="width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </a>
        </div>
        {% endif %}
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-wrapper">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Global Modal: Add / Edit Transaction -->
  <div class="modal-backdrop" id="txModalBackdrop">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="txModalTitle">Add Transaction</h3>
        <button type="button" class="btn-modal-close" id="btnCloseTxModal">
          <svg style="width: 18px; height: 18px;"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <form id="txModalForm">
        <div class="modal-body">
          <input type="hidden" id="modalTxId" value="">
          
          <div class="form-group">
            <label for="modalTxAmount">Amount (₹)</label>
            <input type="number" step="any" min="1" class="form-control" id="modalTxAmount" placeholder="e.g. 500" required>
          </div>

          <div class="form-group">
            <label for="modalTxCategory">Category</label>
            <select class="form-control" id="modalTxCategory" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Health">Health</option>
              <option value="Education">Education</option>
              <option value="Travel">Travel</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="modalTxNote">Note / Description</label>
            <input type="text" class="form-control" id="modalTxNote" placeholder="e.g. Groceries, Dinner, Fuel">
          </div>

          <div class="form-group">
            <label for="modalTxDate">Date</label>
            <input type="date" class="form-control" id="modalTxDate" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" id="btnCancelTxModal">Cancel</button>
          <button type="submit" class="btn-primary" id="btnSaveTxModal">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Global Modal: Confirm Delete -->
  <div class="modal-backdrop" id="deleteModalBackdrop">
    <div class="modal-container" style="max-width: 380px;">
      <div class="modal-header">
        <h3>Delete Transaction</h3>
        <button type="button" class="btn-modal-close" id="btnCloseDeleteModal">
          <svg style="width: 18px; height: 18px;"><use href="#icon-close"></use></svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="font-size: 14px; color: var(--text-secondary); line-height: 1.5;">
          Are you sure you want to delete this transaction? This action will permanently update your spend totals and charts.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outline" id="btnCancelDeleteModal">Cancel</button>
        <button type="button" class="btn-primary" id="btnConfirmDeleteModal">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Shared JavaScript Helper -->
  <script>
    // Global Toast Function
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) {
          toast.parentNode.removeChild(toast);
        }
      }, 4000);
    }

    // Format Indian Rupee in JS
    function formatINR(amount) {
      const isNegative = amount < 0;
      const absAmt = Math.round(Math.abs(amount));
      const str = absAmt.toString();
      let res = '';
      if (str.length <= 3) {
        res = str;
      } else {
        const last3 = str.slice(-3);
        let rem = str.slice(0, -3);
        const groups = [];
        while (rem.length > 2) {
          groups.unshift(rem.slice(-2));
          rem = rem.slice(0, -2);
        }
        if (rem.length > 0) {
          groups.unshift(rem);
        }
        res = groups.join(',') + ',' + last3;
      }
      return (isNegative ? '-₹' : '₹') + res;
    }

    function formatCompactINR(amount) {
      const absAmt = Math.abs(amount);
      const prefix = amount < 0 ? '-₹' : '₹';
      if (absAmt >= 10000000) return `${prefix}${(absAmt/10000000).toFixed(1)}Cr`;
      if (absAmt >= 100000) return `${prefix}${(absAmt/100000).toFixed(1)}L`;
      if (absAmt >= 1000) return `${prefix}${(absAmt/1000).toFixed(1)}k`;
      return `${prefix}${Math.round(absAmt)}`;
    }

    // Modal Control Logic
    const txModalBackdrop = document.getElementById('txModalBackdrop');
    const deleteModalBackdrop = document.getElementById('deleteModalBackdrop');
    let pendingDeleteId = null;

    function openAddModal() {
      document.getElementById('txModalTitle').textContent = 'Add Transaction';
      document.getElementById('modalTxId').value = '';
      document.getElementById('modalTxAmount').value = '';
      document.getElementById('modalTxCategory').value = 'Food';
      document.getElementById('modalTxNote').value = '';
      document.getElementById('modalTxDate').value = new Date().toISOString().split('T')[0];
      txModalBackdrop.classList.add('open');
    }

    function openEditModal(tx) {
      document.getElementById('txModalTitle').textContent = 'Edit Transaction';
      document.getElementById('modalTxId').value = tx.id;
      document.getElementById('modalTxAmount').value = tx.amount;
      document.getElementById('modalTxCategory').value = tx.category;
      document.getElementById('modalTxNote').value = tx.note || '';
      document.getElementById('modalTxDate').value = tx.transaction_date;
      txModalBackdrop.classList.add('open');
    }

    function closeTxModal() {
      txModalBackdrop.classList.remove('open');
    }

    function openDeleteModal(id) {
      pendingDeleteId = id;
      deleteModalBackdrop.classList.add('open');
    }

    function closeDeleteModal() {
      pendingDeleteId = null;
      deleteModalBackdrop.classList.remove('open');
    }

    // Listeners for Modal Closing
    document.getElementById('btnCloseTxModal')?.addEventListener('click', closeTxModal);
    document.getElementById('btnCancelTxModal')?.addEventListener('click', closeTxModal);
    document.getElementById('btnCloseDeleteModal')?.addEventListener('click', closeDeleteModal);
    document.getElementById('btnCancelDeleteModal')?.addEventListener('click', closeDeleteModal);
    document.getElementById('btnSidebarAdd')?.addEventListener('click', openAddModal);

    // Save Transaction Form submission (Add/Edit)
    document.getElementById('txModalForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('modalTxId').value;
      const amount = parseFloat(document.getElementById('modalTxAmount').value);
      const category = document.getElementById('modalTxCategory').value;
      const note = document.getElementById('modalTxNote').value;
      const transaction_date = document.getElementById('modalTxDate').value;

      if (!amount || amount <= 0) {
        showToast('Please enter a valid amount greater than 0', 'error');
        return;
      }

      const payload = { amount, category, note, transaction_date };
      const url = id ? `/api/update-transaction/${id}` : '/api/add-transaction';

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          showToast(id ? 'Transaction updated!' : 'Transaction added!');
          closeTxModal();
          // Dispatch custom event to notify page components
          window.dispatchEvent(new CustomEvent('expenseUpdated'));
        } else {
          showToast(data.error || 'Failed to save transaction', 'error');
        }
      } catch (err) {
        showToast('Network error saving transaction', 'error');
      }
    });

    // Confirm Delete Action
    document.getElementById('btnConfirmDeleteModal')?.addEventListener('click', async () => {
      if (!pendingDeleteId) return;
      try {
        const res = await fetch(`/api/delete-transaction/${pendingDeleteId}`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast('Transaction deleted successfully');
          closeDeleteModal();
          window.dispatchEvent(new CustomEvent('expenseUpdated'));
        } else {
          showToast(data.error || 'Failed to delete transaction', 'error');
        }
      } catch (err) {
        showToast('Network error deleting transaction', 'error');
      }
    });
  </script>

  {% block scripts %}{% endblock %}
</body>
</html>
